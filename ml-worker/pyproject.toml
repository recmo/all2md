[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-worker"
version = "0.1.0"
description = "Local leased audio enhancement, embeddings, and reranking for mdstore"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
  "speech2md; sys_platform == 'darwin'",
  "numpy>=2,<3",
  "pyyaml>=6,<7",
  "mlx-lm==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "transformers==5.12.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10"]

[project.scripts]
ml-worker = "ml_worker.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
speech2md = { path = "../speech2md" }
