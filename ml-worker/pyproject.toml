[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-worker"
version = "0.1.0"
description = "Local leased audio enhancement, embeddings, and reranking for mdstore"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
  "numpy>=2,<3",
  "pyyaml>=6,<7",
  "torch==2.11.0",
  "transformers==5.12.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10"]

[project.scripts]
ml-worker = "ml_worker.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
