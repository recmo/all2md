[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio2md"
version = "0.1.0"
description = "Local MOSS meeting transcription and diarization to Markdown"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
  "mlx-audio[stt]==0.4.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
]

[project.scripts]
audio2md = "audio2md.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audio2md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
