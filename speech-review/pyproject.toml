[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speech-review"
version = "0.1.0"
description = "Local web editor for speech2md transcript hints"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
  "numpy>=2,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10"]

[project.scripts]
speech-review = "speech_review.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/speech_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
