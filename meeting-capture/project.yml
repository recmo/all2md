name: MeetingCapture
options:
  bundleIdPrefix: ventures.wicked
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: V458N7266F
targets:
  MeetingCapture:
    type: application
    platform: macOS
    sources:
      - Sources
      - Shared
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: MeetingCaptureWorker
        embed: false
    postBuildScripts:
      - name: Embed background worker
        script: |
          helper_dir="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$helper_dir"
          cp "$BUILT_PRODUCTS_DIR/MeetingCaptureWorker" "$helper_dir/MeetingCaptureWorker"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/MeetingCaptureWorker
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/MeetingCaptureWorker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ventures.wicked.MeetingCapture
        PRODUCT_NAME: MeetingCapture
        INFOPLIST_KEY_CFBundleDisplayName: Meeting Capture
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Meeting Capture records your microphone during meetings.
        INFOPLIST_KEY_NSAudioCaptureUsageDescription: Meeting Capture records participant audio from meeting applications.
        INFOPLIST_KEY_NSAccessibilityUsageDescription: Meeting Capture can read meeting titles and participant metadata.
        CODE_SIGN_ENTITLEMENTS: MeetingCapture.entitlements
  MeetingCaptureWorker:
    type: tool
    platform: macOS
    sources:
      - Worker
      - Shared
      - Sources/AccessibilityProbe.swift
      - Sources/AudioFinalizer.swift
      - Sources/CaptureError.swift
      - Sources/MeetingStore.swift
      - Sources/Models.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ventures.wicked.MeetingCapture.worker
        PRODUCT_NAME: MeetingCaptureWorker
  MeetingCaptureTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: MeetingCapture
      - target: MeetingCaptureWorker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MeetingCapture:
    build:
      targets:
        MeetingCapture: all
        MeetingCaptureTests: [test]
    test:
      targets: [MeetingCaptureTests]
