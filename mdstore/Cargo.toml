[package]
name = "mdstore"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Git-backed Markdown search and editing daemon"

[features]
default = ["server"]
server = [
    "dep:async-trait",
    "dep:axum",
    "dep:clap",
    "dep:fs2",
    "dep:fastrand",
    "dep:parking_lot",
    "dep:reqwest",
    "dep:serde_cbor",
    "dep:tempfile",
    "dep:thiserror",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[[bin]]
name = "mdstore"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
toml = "1.1"
rumdl = { version = "=0.2.75", default-features = false }
anyhow = "1.0"
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
fs2 = { version = "0.4", optional = true }
fastrand = { version = "2.3", optional = true }
globset = "0.4"
jsonschema = { version = "0.33", default-features = false }
parking_lot = { version = "0.12", optional = true }
pulldown-cmark = "0.13"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_cbor = { version = "0.11", optional = true }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = { version = "3.20", optional = true }
thiserror = { version = "2.0", optional = true }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync", "time"], optional = true }
tower-http = { version = "0.6", features = ["trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
starlark = "=0.14.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
type_complexity = "allow"
await_holding_lock = "warn"
dbg_macro = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
exit = "warn"
filter_map_next = "warn"
fn_params_excessive_bools = "warn"
if_let_mutex = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
must_use_candidate = "warn"
needless_borrow = "warn"
needless_continue = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
option_option = "warn"
redundant_clone = "warn"
ref_option = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_self_not_must_use = "warn"
single_match_else = "warn"
str_to_string = "warn"
suboptimal_flops = "warn"
todo = "warn"
trivially_copy_pass_by_ref = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
use_self = "warn"
verbose_file_reads = "warn"
