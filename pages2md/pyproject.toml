[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pages2md"
version = "0.2.0"
description = "Local-first OCR conversion of paginated image sources to clean Markdown"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "beautifulsoup4>=4.13.0,<5",
  "mdformat==1.0.0",
  "mdformat-gfm==1.0.0",
  "mdformat-footnote==0.1.3",
  "mdit-py-plugins>=0.4,<1",
  "markdown-it-py>=3,<5",
  "linkify-it-py>=2,<3",
  "pillow>=11.0.0,<13",
  "pymarkdownlnt==0.9.38",
  "pymupdf>=1.26.0,<2",
  "tqdm>=4.67.0,<5",
]

[project.optional-dependencies]
ocr = [
  "mlx-vlm @ git+https://github.com/Blaizzy/mlx-vlm.git@fbdfc837da0ee197a18859ea327ede858631bdb1",
]
dev = [
  "pytest>=8.4.0,<10",
]

[project.scripts]
pages2md = "pages2md.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pages2md"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
